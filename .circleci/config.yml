version: 2.1
defaults: &defaults
  docker:
    - image: cimg/python:3.13.2-browsers
install_dependency: &install_dependency
  name: Installation of build and deployment dependencies.
  command: |
    sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
    sudo apt-get update || true
    sudo apt-get install -y jq python3-pip
    sudo pip3 install awscli --upgrade
install_deploysuite: &install_deploysuite
  name: Installation of install_deploysuite.
  command: |
    git clone --branch v1.4.17 https://github.com/topcoder-platform/tc-deploy-scripts ../buildscript
    cp ./../buildscript/master_deploy.sh .
    cp ./../buildscript/buildenv.sh .
    cp ./../buildscript/awsconfiguration.sh .
    cp ./../buildscript/psvar-processor.sh .

restore_cache_settings_for_build: &restore_cache_settings_for_build
  key: docker-tc-notify-{{ checksum "package-lock.json" }}

save_cache_settings: &save_cache_settings
  key: docker-tc-notify-{{ checksum "package-lock.json" }}
  paths:
    - node_modules

run_build: &run_build
  name: Build of Docker image
  command: ./build.sh

builddeploy_steps: &builddeploy_steps
  - checkout
  - setup_remote_docker
  - run: *install_dependency
  - run: *install_deploysuite
  - run: *run_build
  - deploy:
      name: Running Masterscript - deploy tc-notifications services
      command: |
        ./awsconfiguration.sh $DEPLOY_ENV
        source awsenvconf
        echo "Running Masterscript - deploy tc-notifications-api service"
        ./psvar-processor.sh -t appenv -p /config/${APPNAME}/deployvar
        source deployvar_env
        ./master_deploy.sh -d ECS -e $DEPLOY_ENV -t latest -j /config/${APPNAME}/appvar,/config/common/global-appvar -i ${APPNAME} -p FARGATE
        echo "Running Masterscript - deploy tc-notifications-consumers service"
        ./psvar-processor.sh -t appenv -p /config/${CONSUMERNAME}/deployvar
        source deployvar_env
        ./master_deploy.sh -d ECS -e $DEPLOY_ENV -t latest -j /config/${APPNAME}/appvar,/config/common/global-appvar -i ${APPNAME} -p FARGATE
        echo "Running Masterscript - deploy tc-notifications-general-processor service"
        ./psvar-processor.sh -t appenv -p /config/${PROCESSORNAME}/deployvar
        source deployvar_env
        ./master_deploy.sh -d ECS -e $DEPLOY_ENV -t latest -j /config/${APPNAME}/appvar,/config/common/global-appvar -i ${APPNAME} -p FARGATE

jobs:
  # Build & Deploy against development backend
  "build-dev":
    <<: *defaults
    environment:
      DEPLOY_ENV: "DEV"
      LOGICAL_ENV: "dev"
      APPNAME: "tc-notifications"
      CONSUMERNAME: "tc-notifications-consumers"
      PROCESSORNAME: "tc-notifications-general-processor"
    steps: *builddeploy_steps

  "build-qa":
    <<: *defaults
    environment:
      DEPLOY_ENV: "QA"
      LOGICAL_ENV: "qa"
      APPNAME: "tc-notifications"
      CONSUMERNAME: "tc-notifications-consumers"
      PROCESSORNAME: "tc-notifications-general-processor"
      CODEARTIFACT_ENV: "PROD"
    steps: *builddeploy_steps

  "build-prod":
    <<: *defaults
    environment:
      DEPLOY_ENV: "PROD"
      LOGICAL_ENV: "prod"
      APPNAME: "tc-notifications"
      CONSUMERNAME: "tc-notifications-consumers"
      PROCESSORNAME: "tc-notifications-general-processor"
    steps: *builddeploy_steps

workflows:
  version: 2
  build:
    jobs:
      # Development builds are executed on "develop" branch only.
      - "build-dev":
          context: org-global
          filters:
            branches:
              only: [dev, 'PM-973_deprecate-connect']
      - "build-qa":
          context: org-global
          filters:
            branches:
              only: qa
      - "build-prod":
          context: org-global
          filters:
            branches:
              only: master